[package]
name = "shadowbox"
version = "0.1.0"
edition = "2021"
authors = ["Antigravity & User <dev@shadowbox.local>"]
description = "A zero-trust, copy-on-write sandbox and interactive time-machine for AI coding agents."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Nari-Ab/shadowbox"
homepage = "https://github.com/Nari-Ab/shadowbox"
readme = "README.md"
keywords = ["ai-agents", "sandbox", "claude-code", "cursor", "security"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
    "docs/*",
    "scripts/*",
    "npm/*",
    "Formula/*",
    ".github/*",
]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
libc = "0.2"
portable-pty = "0.8"
ratatui = "0.29"
crossterm = "0.28"
similar = { version = "2.6", features = ["unicode"] }
notify = "7.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.14"

[[bin]]
name = "shadowbox"
path = "src/main.rs"

[lib]
name = "shadowbox"
path = "src/lib.rs"
